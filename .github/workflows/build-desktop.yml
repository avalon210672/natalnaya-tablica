# Сборка desktop (macOS + Windows) и portable HTML в облаке GitHub.
name: Build Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: desktop-macos
          - platform: windows-latest
            artifact: desktop-windows

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          uploadArtifact: true
          artifactName: ${{ matrix.artifact }}

  build-portable:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build portable HTML
        run: npm ci && npm run build:portable

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: portable-html-windows-mac
          path: |
            release/Натальная-Таблица.html
            release/Запуск (macOS).command
            release/Запуск (Windows).bat
            release/КАК-ЗАПУСТИТЬ.txt
          if-no-files-found: error
